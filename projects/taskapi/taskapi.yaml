openapi: 3.0.3
info:
  version: '1.0'
  title: Task API
  description: |
    This API lets you manage tasks on the calendar. You can do so for personal tasks on your own calendar, or shared tasks on a team calendar. Tasks are useful for tracking deadlines, organizing work and responsibilities, or monitoring overdue work.

    For example, imagine you wanted to attend a World Cup match with a group of friends. You could create an event on a shared calendar for the day of the match. Then, you could delegate work to each friend, like buying tickets, booking a hotel, or organizing transportation. Then, you could add a task assigned to each friend, with reminders before the event day. 

    **Typical workflow**:
    1. **Create a task** using POST /tasks. Provide `title`, `status`, and optionally `dueDate` and `assignee`.
    2. **Update a task** using PUT /tasks/{taskId} to modify status or details.
    3. **Complete a task** using POST /tasks/{taskId}/complete. This moves it to `/tasks/completed` and marks it as inactive.
    4. **Retrieve tasks** using GET /tasks or GET /tasks/completed.

    > Note: Tasks past their due date automatically change status to `missed`.

    You can optionally add OAuth authentication. This authenticates the calendar owner, ensuring that only they can edit the calendar or edit/complete tasks. OAuth also allows the calendar owner to share it with others and allow editing permissions. To add OAuth, work with a calendar administrator to enable authentication. When enabled, you can use an OAuth bearer token in the --header of your requests.
  contact:
    name: Sean P.
    email: sean.patterson1989@gmail.com
    url: spatte22.github.io
  license:
    url: 'https://opensource.org/licenses/MIT'
    name: MIT
paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: Get a list of all tasks
      description: |
        Returns information about all active, open, and missed tasks for a calendar. You must provide your calendar username as a query parameter. To get information on all completed tasks, use **GET /tasks/completed**. 

        By default, the returned tasks are ordered ascending by `dueDate`. You can return a maximum of 1000 tasks at a time. Use `offset` to paginate through results. 

        Returns an empty array if no tasks exist for the username.

        **Possible 400 errors**:
          - The `username` query parameter is missing.
          - The `offset` parameter is not a valid number.
      operationId: getTasks
      parameters:
        - name: username
          in: query
          description: 'The username with which you created the calendar, which is also the owner of the calendar. By default, the system uses the email address for the username, unless the user adds a custom name.'
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description: |
            The number of task records to skip, allowing you to paginate through tasks (maximum 1000).
            If omitted, pagination starts at the beginning.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: |
            Tasks retrieved successfully. Returns an array of task objects.
            - If no tasks exist, the array is empty.
            - Tasks are sorted by `dueDate` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              examples:
                default:
                  value:
                    - id: 8675309
                      title: Buy World Cup tickets
                      status: open
                      dueDate: '2026-02-14T12:00:00'
                    - id: 9035768
                      title: Make hotel reservation
                      status: open
                      dueDate: '2026-02-15T23:59:59'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - Tasks
      summary: Create a task
      description: |
        Creates a new task on the user's calendar. The task appears in the task list immediately and can be updated, completed, or deleted. This endpoint accepts required fields for `title` and `status`, and optional fields such as `dueDate`. Use this endpoint to add reminders for upcoming events or deadlines. Responses include the complete task object with the server-assigned `id`. 
      operationId: postTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
              example:
                title: Buy World Cup tickets
                status: open
                dueDate: '2026-02-14T12:00:00'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
                example:
                  id: 8675309
                  title: Buy World Cup tickets
                  status: open
                  dueDate: '2026-02-14T12:00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/tasks/{taskId}':
    get:
      tags:
        - Tasks
      summary: Get a task
      description: |
        Returns information about a single task. 
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          description: Unique identifier of the task. You can find a task's ID using **GET /tasks**.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            Task retrieved successfully. Returns an array of task objects. If no tasks exist, the array is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
                example:
                  id: 8675309
                  title: Buy World Cup tickets
                  status: open
                  dueDate: '2026-02-14T12:00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags:
        - Tasks
      summary: Update a task
      description: |
        Updates the details of an existing task. For example, you could update a task to `active` to indicate that it's being worked on.

        Use **POST /tasks/{taskId}/complete** to complete a task. That updates its status, visually disables the task from the calendar, and moves the task to the list of completed tasks.

        If you mark a task as `complete` with this endpoint, only the status changes; the task does not move to the list of completed tasks, nor does the visual representation change on the calendar. 

        If a task's `dueDate` passes and it's not marked as `complete`, the system automatically changes its `status` to `missed`. 
      operationId: putTask
      parameters:
        - name: taskId
          in: path
          description: Unique identifier of the task. You can find a task's ID using **GET /tasks**.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
              example:
                title: Buy World Cup tickets
                status: open
                dueDate: '2026-02-14T12:00:00'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
                example:
                  id: 8675309
                  title: Buy World Cup tickets
                  status: open
                  dueDate: '2026-02-14T12:00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Tasks
      summary: Delete a task
      description: |
        Deletes a task and removes it from the calendar. Deleting a task removes it from the system forever. You can typically use this to remove a task that was accidentally created or is no longer needed.

        Best practice is to only delete a task when you do not want to access it again in the future. Use **POST /tasks/{taskId}/complete** to mark a task as completed. Completed tasks are archived in the system, and are accessible via **GET /tasks/completed**.
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          description: Unique identifier of the task. You can find a task's ID using **GET /tasks**.
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/tasks/{taskId}/complete':
    post:
      tags:
        - Tasks
      summary: Complete a task
      description: |
        Marks a task as complete and moves it to `/tasks/completed`. After completing a task, its status changes to `complete` and becomes inactive on the calendar. Inactive tasks help users quickly see which tasks they have yet to complete and which ones can be ignored.
      operationId: postCompletedTasks
      parameters:
        - name: taskId
          in: path
          description: Unique identifier of the task. You can find a task's ID using **GET /tasks**.
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task marked as complete.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /tasks/completed:
    get:
      tags:
        - Tasks
      summary: Get a list of all completed tasks
      description: |
        Returns information about all completed tasks for a calendar. You must provide your calendar username as a query parameter. You can return a maximum of 1000 tasks at a time. Use `offset` to paginate through results. 
      operationId: getCompletedTask
      parameters:
        - name: username
          in: query
          description: Unique identifier of the task. You can find a task's ID using **GET /tasks**.
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description: |
            The number of task records to skip, allowing you to paginate through tasks (maximum 1000).
            If omitted, pagination starts at the beginning.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: |
            Tasks retrieved successfully. Returns an array of completed task objects.
            - If no tasks exist, the array is empty.
            - Tasks are sorted by `dueDate` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              examples:
                default:
                  value:
                    - id: 8675305
                      title: Buy Christmas gifts
                      status: complete
                      dueDate: '2025-12-24T12:00:00'
                    - id: 5035768
                      title: Buy fireworks
                      status: complete
                      dueDate: '2025-12-31T23:59:59'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
tags:
  - name: Tasks
    description: 'Create, retrieve, update, and manage tasks on a user''s calendar.'
components:
  responses:
    BadRequest:
      description: "Invalid request syntax or data\t- check required fields, JSON format, or data types."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: Query parameter `username` is required.
                code: BAD_REQUEST
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: Valid access token required if enabled by an administrator.
                code: UNAUTHORIZED
    Forbidden:
      description: The client does not have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: You do not have permission to modify this calendar.
                code: FORBIDDEN
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: No tasks found for user `Bilbo Baggins`.
                code: NOT_FOUND
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: A task with the same title and `dueDate` already exists.
                code: CONFLICT
    InternalServerError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: An unexpected error occurred.
                code: INTERNAL_SERVER_ERROR
    ServiceUnavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                message: The service is currently unavailable. Please try again later.
                code: SERVICE_UNAVAILABLE
  schemas:
    Task:
      type: object
      description: Represents a single task on a user's calendar.
      properties:
        id:
          type: integer
          description: The unique identifier for a single task.
        title:
          type: string
          description: 'The name of the task, which appears in the calendar event. Maximum 100 characters.'
        taskType:
          type: string
          enum:
            - task
            - event
            - call
            - reminder
          description: 'The type or category of task, which lets you add intuitive context to the calendar item.'
        dueDate:
          type: string
          description: |
            The final date and time that the task needs to be completed by. Tasks not completed by the due date have a `missed` status.
            Use ISO 8601 date and time format (YYYY-MM-DDTHH:MM:SS). 
          format: date-time
        status:
          type: string
          enum:
            - open
            - active
            - complete
            - missed
          description: |
            Helps the system and the user keep track of how a task is progressing. 
            - `open`: Task has been created but not yet started. If `status` is not set to `open` or `active`, the task defaults to `open`.
            - `active`: Task is in progress.
            - `complete`: Task has been finished. The task becomes inactive on the calendar, visually indicating that it's done.
            - `missed`: Task was not completed by the due date.
        assignee:
          type: string
          description: The name of the person to whom the task is assigned.
      required:
        - id
        - title
        - dueDate
        - status
    NewTask:
      type: object
      properties:
        id:
          readOnly: true
      allOf:
        - $ref: '#/components/schemas/Task'
    Error:
      type: object
      properties:
        message:
          type: string
          description: 'Human-readable explanation of the error. For example, "Query parameter `username` is required".'
        code:
          type: string
          description: 'Application-specific error identifier. For example, "BAD_REQUEST".'
      required:
        - message
